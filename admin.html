<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Bulk Upload Test</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; text-align: center; }
        .container { max-width: 600px; background: white; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, select, textarea { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; font-family: monospace;}
        button { background: #e74c3c; color: white; border: none; padding: 12px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; width: 100%; margin-top: 10px; font-weight:bold;}
        button:hover { background: #c0392b; }
        .success { color: green; display: none; margin-top: 10px; font-weight: bold;}
        .error { color: red; display: none; margin-top: 10px; font-weight: bold;}
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="container">
        <h1>Admin Panel 🛠️ (Bulk Upload)</h1>
        <p>विषय चुनें, टेस्ट का नाम लिखें और JSON कोड पेस्ट करें</p>
        
        <select id="subjectSelect">
            <option value="History_Class12">History (Class 12)</option>
            <option value="English_Class12">English (Class 12)</option>
            <option value="Geography_Class12">Geography (Class 12)</option>
            <option value="Hindi_Class12">Hindi (Class 12)</option>
        </select>

        <input type="text" id="testName" placeholder="टेस्ट का नाम (जैसे: Chapter 1 & 2 Mock Test)">
        
        <!-- यहाँ एक साथ सारे प्रश्न पेस्ट होंगे -->
        <textarea id="bulkData" rows="10" placeholder="यहाँ प्रश्नों का JSON कोड पेस्ट करें..."></textarea>
        
        <button onclick="saveBulkTest()">🚀 एक साथ पूरा टेस्ट अपलोड करें</button>
        <p class="success" id="msgSuccess">टेस्ट सफलतापूर्वक अपलोड हो गया!</p>
        <p class="error" id="msgError"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCBwUnvVsCI5Fl05e8pwUeZwcGN0S1FFN4",
            authDomain: "bsebquiz-8d9cd.firebaseapp.com",
            databaseURL: "https://bsebquiz-8d9cd-default-rtdb.firebaseio.com",
            projectId: "bsebquiz-8d9cd",
            storageBucket: "bsebquiz-8d9cd.firebasestorage.app",
            messagingSenderId: "954222791141",
            appId: "1:954222791141:web:575488a4eb4f6ca31f870c"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function saveBulkTest() {
            const subject = document.getElementById("subjectSelect").value;
            const testName = document.getElementById("testName").value.trim();
            const jsonText = document.getElementById("bulkData").value.trim();

            const msgError = document.getElementById("msgError");
            const msgSuccess = document.getElementById("msgSuccess");
            msgError.style.display = "none";
            msgSuccess.style.display = "none";

            if(testName === "" || jsonText === "") {
                msgError.innerText = "कृपया टेस्ट का नाम लिखें और कोड पेस्ट करें!";
                msgError.style.display = "block";
                return;
            }

            try {
                // कोड को चेक कर रहा है कि वो सही JSON है या नहीं
                const questionsArray = JSON.parse(jsonText);
                
                // डेटाबेस में नए टेस्ट के नाम से सेव करना
                db.ref('Quizzes/' + subject + '/' + testName).set(questionsArray)
                .then(() => {
                    document.getElementById("testName").value = "";
                    document.getElementById("bulkData").value = "";
                    msgSuccess.style.display = "block";
                    setTimeout(() => msgSuccess.style.display = "none", 4000);
                }).catch((error) => {
                    msgError.innerText = "डेटाबेस एरर: " + error.message;
                    msgError.style.display = "block";
                });

            } catch (e) {
                msgError.innerText = "एरर! आपके द्वारा पेस्ट किया गया कोड सही फॉर्मेट (JSON) में नहीं है।";
                msgError.style.display = "block";
            }
        }
    </script>
</body>
</html>
